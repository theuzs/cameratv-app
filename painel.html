<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Câmera TV · Painel</title>
<!--
  Painel remoto do Câmera TV. Publicado em https://theuzs.github.io/cameratv-app/painel.html
  (para o celular) pelo workflow "Publicar painel", a cada mudança neste arquivo. No
  computador também abre direto do arquivo: tools\abrir-painel.cmd.

  Ele lê do Supabase o que os aparelhos enviam (ver Report.java e tools/painel.sql).
  Não guarda segredo nenhum: a chave abaixo é a pública do projeto, e a leitura só
  funciona depois de entrar com o e-mail e a senha do dono.
-->
<style>
  :root {
    --bg: #0B0B10; --panel: #15141C; --raised: #1D1B26; --line: #2A2833; --text: #F4F1EA; --muted: #A39FB0;
    --accent: #FFB547; --accent-ink: #1A1206; --danger: #FF5D5D; --ok: #4ADE80;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; flex: 1 1 auto; }
  h2 { font-size: 13px; margin: 28px 0 10px; color: var(--muted); font-weight: 600;
       text-transform: uppercase; letter-spacing: .06em; }
  .muted { color: var(--muted); }
  button, select, input {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 100px; padding: 7px 16px;
  }
  input { border-radius: 12px; width: 100%; }
  button { cursor: pointer; }
  button:hover, button:focus-visible, summary:focus-visible { border-color: var(--accent); outline: none; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.link { border: 0; padding: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; }
  label.check { display: inline-flex; align-items: center; gap: 6px; }
  label.check input { width: auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }

  #login { max-width: 400px; margin: 8vh auto 0; display: grid; gap: 12px; }
  #login label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
  #message { margin: 10px 0; color: var(--accent); min-height: 1.5em; }

  /* Resumo no alto: a resposta para "está tudo bem?" */
  #summary { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 12px;
             border: 1px solid var(--line); background: var(--panel); }
  #summary .big { font-size: 20px; font-weight: 700; }
  #summary.ok { border-color: rgba(74, 222, 128, .45); }
  #summary.warn { border-color: rgba(255, 181, 71, .55); }
  #summary.bad { border-color: rgba(255, 93, 93, .6); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--muted); }
  .ok > .dot, .dot.ok { background: var(--ok); }
  .warn > .dot, .dot.warn { background: var(--accent); }
  .bad > .dot, .dot.bad { background: var(--danger); }

  #devices { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .device .top { display: flex; align-items: center; gap: 10px; }
  .device .top h3 { margin: 0; font-size: 18px; flex: 1 1 auto; overflow-wrap: anywhere; }
  .device .seen { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .device .state { font-weight: 600; margin: 8px 0 12px; }
  .device.warn .state { color: var(--accent); }
  .device.bad .state { color: var(--danger); }
  .cams { display: flex; flex-wrap: wrap; gap: 8px; }
  .cam { display: flex; align-items: center; gap: 8px; background: var(--raised); border: 1px solid var(--line);
         border-radius: 10px; padding: 8px 12px; flex: 1 1 130px; }
  .cam b { display: block; font-size: 14px; }
  .cam small { color: var(--muted); }
  .facts { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .notes { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--accent); }
  .notes li::before { content: "! "; font-weight: 700; }
  details { margin-top: 10px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); border: 1px solid transparent; border-radius: 8px; width: max-content; padding: 0 4px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 8px 0 0; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  #events { padding: 4px 0; overflow: hidden; }
  .day { padding: 8px 16px 4px; color: var(--muted); font-size: 12px; font-weight: 600;
         text-transform: uppercase; letter-spacing: .06em; border-top: 1px solid var(--line); }
  .day:first-child { border-top: 0; }
  .event { display: grid; grid-template-columns: 70px 1fr; gap: 12px; padding: 5px 16px; font-size: 14px; }
  .event.many { grid-template-columns: 70px 150px 1fr; }
  .event .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .event .who { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .event .what { white-space: pre-wrap; overflow-wrap: anywhere; }
  .event.problem .what { color: var(--accent); }
  .event.serious .what { color: var(--danger); font-weight: 600; }
  .event.good .what::before { content: "✓ "; color: var(--ok); }
  .event.more .what { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  @media (max-width: 600px) {
    .event, .event.many { grid-template-columns: 62px 1fr; }
    .event.many .who { display: none; }
    #summary .big { font-size: 17px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Câmera TV · Painel</h1>
    <span id="updated" class="muted"></span>
    <button id="refresh" hidden>Atualizar</button>
    <button id="logout" hidden>Sair</button>
  </header>

  <form id="login" class="card" hidden>
    <strong>Entrar no painel</strong>
    <label id="projectRow">Endereço do projeto (https://xxxx.supabase.co)
      <input id="project" autocomplete="off" spellcheck="false"></label>
    <label id="keyRow">Chave pública do projeto (anon ou publishable)
      <input id="key" autocomplete="off" spellcheck="false"></label>
    <label>E-mail
      <input id="email" type="email" autocomplete="username"></label>
    <label>Senha
      <input id="password" type="password" autocomplete="current-password"></label>
    <button class="primary">Entrar</button>
    <span class="muted" style="font-size:13px">É um usuário só do painel. Deixe o navegador salvar a senha.</span>
  </form>

  <div id="message"></div>

  <section id="panel" hidden>
    <div id="summary"><span class="dot"></span><div><div class="big" id="summaryTitle"></div><div class="muted" id="summaryText"></div></div></div>

    <h2>Aparelhos</h2>
    <div id="devices"></div>

    <h2>Histórico</h2>
    <div class="bar">
      <select id="filter"><option value="">Todos os aparelhos</option></select>
      <label class="check"><input id="onlyProblems" type="checkbox"> Só problemas</label>
      <span class="muted" id="count"></span>
      <span style="flex:1"></span>
      <button id="purge">Apagar registros com mais de 30 dias</button>
    </div>
    <div id="events" class="card"></div>
  </section>
</main>

<script>
// Com os dois preenchidos, a tela de entrada pede só e-mail e senha.
const PROJETO = "https://pqyrrfbcqkytpvrkykwf.supabase.co";
const CHAVE = "sb_publishable_ga8QWidTlROwdoJtAUZtzg_KNfxo5AI";

const SILENT_MIN = 25;        // sem situação nova por esse tempo = aparelho sem notícias
const REFRESH_MS = 60000;
const PROBLEM = /congelou|imagem parada|continua parada|não respondeu|não conectou|parou de transmitir|sem rede|falhou|não foi|não pôde|não liberado|bloque|saiu da lista|venceu|Secundário:|não achou|desligou a tela|protetor de tela do aparelho entrou/i;
const SERIOUS = /ERRO que fechou|parou de responder|Reabrindo o app|não reinicia|players antigos/i;
const GOOD = /imagem no ar|aparelho liberado|voltou a|instalada|ligou a tela de novo/i;

const $ = id => document.getElementById(id);
const store = {
  get(key) { try { return JSON.parse(localStorage.getItem("camtv." + key)); } catch (e) { return null; } },
  set(key, value) { try { localStorage.setItem("camtv." + key, JSON.stringify(value)); } catch (e) { /* sem armazenamento: pede de novo na próxima vez */ } },
  del(key) { try { localStorage.removeItem("camtv." + key); } catch (e) { /* idem */ } },
};

let config = { project: PROJETO || (store.get("config") || {}).project || "", key: CHAVE || (store.get("config") || {}).key || "" };
let session = store.get("session");
let names = store.get("names") || {};
let timer = null;

function say(text) { $("message").textContent = text || ""; }
function base() { return config.project.replace(/\/+$/, ""); }

async function auth(body, grant) {
  const reply = await fetch(base() + "/auth/v1/token?grant_type=" + grant, {
    method: "POST",
    headers: { apikey: config.key, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await reply.json().catch(() => ({}));
  if (!reply.ok) throw new Error(data.error_description || data.msg || data.message || ("resposta " + reply.status));
  session = { access: data.access_token, refresh: data.refresh_token };
  store.set("session", session);
}

// Chamada à API do banco; se a sessão venceu, renova uma vez e repete.
async function api(path, options, retried) {
  const reply = await fetch(base() + "/rest/v1/" + path, Object.assign({}, options, {
    headers: Object.assign({ apikey: config.key, Authorization: "Bearer " + session.access }, (options || {}).headers),
  }));
  if (reply.status === 401 && !retried && session.refresh) {
    await auth({ refresh_token: session.refresh }, "refresh_token");
    return api(path, options, true);
  }
  if (!reply.ok) {
    const data = await reply.json().catch(() => ({}));
    throw new Error(data.message || ("resposta " + reply.status));
  }
  return reply.status === 204 ? null : reply.json();
}

const pad = n => String(n).padStart(2, "0");
function when(iso) {
  const d = new Date(iso);
  return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function ago(iso) {
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 1) return "agora";
  if (min < 60) return "há " + min + " min";
  if (min < 48 * 60) return "há " + Math.round(min / 60) + " h";
  return "há " + Math.round(min / 1440) + " dias";
}
function nameOf(code) { return names[code] || code; }
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// Situação de um aparelho: nível (ok, warn, bad), frase e avisos.
function judge(row) {
  const d = row.dados || {};
  const cameras = d.cameras || [];
  const silentMin = (Date.now() - new Date(row.recebido_em).getTime()) / 60000;
  const off = cameras.filter(c => !c.noAr && c.situacao !== "desligada em Visões");
  let level = "ok", state = "Tudo no ar";
  if (silentMin > SILENT_MIN) {
    level = "bad"; state = "Sem notícias " + ago(row.recebido_em) + ": app fechado, aparelho desligado ou sem internet";
  } else if (d.ativacao && d.ativacao !== "Liberado") {
    level = "warn"; state = "Ativação: " + d.ativacao;
  } else if (off.length) {
    level = "warn"; state = "Sem imagem: " + off.map(c => c.nome).join(", ");
  }
  const notes = [];
  const rest = d.repouso || "";
  const sleeps = /dorme após (?!nunca|\(não)/.test(rest);
  if (d.tv && (sleeps || /protetor de tela ligado/.test(rest))) {
    notes.push("O Android pode pôr este aparelho para dormir" + (sleeps ? " (" + rest.match(/dorme após [^;]+/)[0] + ")" : " (protetor de tela ligado)"));
  }
  if (d.tv && /não tem neste APK/.test(d.semToque || "")) notes.push("Está com o APK comum: as atualizações pedem um toque");
  if (cameras.some(c => /não manda som/.test(c.som || ""))) notes.push("O som está ligado, mas a câmera não manda áudio" + (d.qualidade === "Secundário" ? " em Secundário" : ""));
  for (const c of cameras) {
    if (c.noAr && c.qps !== undefined && c.qps < 5) notes.push(c.nome + " com imagem lenta: " + c.qps + " quadros por segundo");
  }
  if (/pronta|disponível/.test(d.atualizacao || "")) notes.push("Versão nova esperando: " + d.atualizacao);
  if (d.fechando) notes.push(d.fechando + " player(s) antigo(s) sem fechar");
  return { level, state, notes };
}

function renderSummary(rows) {
  const box = $("summary");
  const levels = rows.map(r => judge(r).level);
  const bad = levels.filter(l => l === "bad").length, warn = levels.filter(l => l === "warn").length;
  const level = bad ? "bad" : warn ? "warn" : rows.length ? "ok" : "";
  box.className = level;
  $("summaryTitle").textContent = !rows.length ? "Nenhum aparelho enviou dados ainda"
    : bad ? bad + (bad === 1 ? " aparelho sem notícias" : " aparelhos sem notícias")
    : warn ? warn + (warn === 1 ? " aparelho precisa de atenção" : " aparelhos precisam de atenção")
    : "Tudo no ar";
  const cams = rows.flatMap(r => (r.dados || {}).cameras || []);
  $("summaryText").textContent = !rows.length ? "O app envia a situação a cada 10 minutos, com ele aberto."
    : rows.length + (rows.length === 1 ? " aparelho" : " aparelhos") + " · " + cams.filter(c => c.noAr).length + " de " + cams.length + " câmeras com imagem";
}

function renderDevices(rows) {
  const box = $("devices");
  box.replaceChildren();
  rows.sort((a, b) => nameOf(a.codigo).localeCompare(nameOf(b.codigo)));
  for (const row of rows) {
    const d = row.dados || {};
    const cameras = d.cameras || [];
    const { level, state, notes } = judge(row);
    const card = el("div", "card device " + level);

    const top = el("div", "top " + level);
    top.append(el("span", "dot"), el("h3", "", nameOf(row.codigo)), el("span", "seen", "visto " + ago(row.recebido_em)));
    card.append(top);
    card.append(el("div", "state", state));

    const cams = el("div", "cams");
    for (const c of cameras) {
      const hidden = c.situacao === "desligada em Visões";
      const cam = el("div", "cam " + (c.noAr ? "ok" : hidden ? "" : "bad"));
      const text = el("div");
      text.append(el("b", "", c.nome), el("small", "", c.situacao || ""));
      cam.append(el("span", "dot"), text);
      cams.append(cam);
    }
    card.append(cams);

    card.append(el("div", "facts", ["Versão " + (d.versao || "?"), d.qualidade, d.modelo, "Android " + (d.android || "?")].filter(Boolean).join(" · ")));

    if (notes.length) {
      const list = el("ul", "notes");
      for (const note of notes) list.append(el("li", "", note));
      card.append(list);
    }

    const more = el("details");
    more.append(el("summary", "", "Detalhes"));
    const list = el("dl");
    const add = (label, value) => { if (value !== undefined && value !== null && value !== "") list.append(el("dt", "", label), el("dd", "", String(value))); };
    add("Código", row.codigo);
    add("Última situação", when(row.recebido_em));
    add("Ativação", d.ativacao);
    add("Atualização", (d.atualizacao || "") + (d.semToque ? " · sem toque: " + d.semToque : ""));
    for (const c of cameras) {
      add(c.nome, (c.ip || "")
        + (c.qps !== undefined ? " · " + c.qps + " quadros por segundo" + (c.perdidos ? " (" + c.perdidos + " descartados)" : "") : "")
        + (c.som ? " · som: " + c.som : ""));
    }
    add("Rede", d.rede);
    add("Ligado", d.ligadoHaMin === undefined ? "" : "há " + (d.ligadoHaMin < 120 ? d.ligadoHaMin + " min" : Math.round(d.ligadoHaMin / 60) + " h") + " sem reiniciar");
    add("Volume", d.volume);
    add("Repouso", d.repouso);
    more.append(list);
    const rename = el("button", "link", "Dar um nome a este aparelho");
    rename.type = "button";
    rename.style.marginTop = "8px";
    rename.onclick = () => {
      const typed = prompt("Nome deste aparelho (" + row.codigo + "):", names[row.codigo] || "");
      if (typed === null) return;
      if (typed.trim()) names[row.codigo] = typed.trim(); else delete names[row.codigo];
      store.set("names", names);
      load();
    };
    more.append(rename);
    card.append(more);
    box.append(card);
  }
}

function renderFilter(rows) {
  const select = $("filter");
  const chosen = select.value;
  select.replaceChildren(new Option("Todos os aparelhos", ""));
  for (const row of rows) select.append(new Option(nameOf(row.codigo), row.codigo));
  select.value = [...select.options].some(o => o.value === chosen) ? chosen : "";
  select.hidden = rows.length < 2;
}

function renderEvents(rows, many) {
  const box = $("events");
  box.replaceChildren();
  const only = $("onlyProblems").checked;
  const today = new Date();
  const todayText = pad(today.getDate()) + "/" + pad(today.getMonth() + 1);
  let shown = 0, lastDay = null;
  for (const row of rows) {
    // Cada linha começa com a data e a hora do aparelho: "13/11 09:49:08  texto".
    const parts = /^(\d\d\/\d\d) (\d\d:\d\d):\d\d\s+([\s\S]*)$/.exec(row.texto);
    const text = parts ? parts[3] : row.texto.trim();
    const serious = SERIOUS.test(text);
    const problem = serious || PROBLEM.test(text);
    if (only && !problem) continue;
    if (parts && parts[1] !== lastDay) {
      lastDay = parts[1];
      box.append(el("div", "day", lastDay === todayText ? "Hoje, " + lastDay : lastDay));
    }
    const line = el("div", "event" + (many ? " many" : "")
      + (!parts ? " more" : serious ? " serious" : problem ? " problem" : GOOD.test(text) ? " good" : ""));
    line.title = "Recebido em " + when(row.recebido_em);
    line.append(el("div", "time", parts ? parts[2] : ""));
    if (many) line.append(el("div", "who", nameOf(row.codigo)));
    line.append(el("div", "what", text));
    box.append(line);
    shown++;
  }
  if (!shown) box.append(el("div", "event muted", only ? "Nenhum problema nas últimas linhas." : "Nenhuma linha recebida ainda."));
  $("count").textContent = shown + (shown === 1 ? " linha" : " linhas") + ", a mais nova primeiro";
}

async function load() {
  try {
    const devices = await api("camtv_aparelhos?select=codigo,recebido_em,dados");
    renderFilter(devices);
    const code = $("filter").value;
    const events = await api("camtv_registros?select=recebido_em,codigo,texto&tipo=eq.evento&order=id.desc&limit=400"
      + (code ? "&codigo=eq." + encodeURIComponent(code) : ""));
    renderSummary(devices);
    renderDevices(devices);
    renderEvents(events, devices.length > 1 && !code);
    $("updated").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    say("");
  } catch (error) {
    say("Não foi possível ler o painel: " + error.message + ".");
  }
}

function show(logged) {
  $("login").hidden = logged;
  $("panel").hidden = !logged;
  $("refresh").hidden = !logged;
  $("logout").hidden = !logged;
  $("projectRow").hidden = !!PROJETO;
  $("keyRow").hidden = !!CHAVE;
  $("project").value = config.project;
  $("key").value = config.key;
  clearInterval(timer);
  if (logged) { load(); timer = setInterval(load, REFRESH_MS); }
}

$("login").onsubmit = async event => {
  event.preventDefault();
  config = { project: (PROJETO || $("project").value).trim(), key: (CHAVE || $("key").value).trim() };
  if (!/^https:\/\/.+/.test(config.project) || !config.key) { say("Preencha o endereço do projeto (começa com https://) e a chave pública."); return; }
  say("Entrando…");
  try {
    await auth({ email: $("email").value.trim(), password: $("password").value }, "password");
    store.set("config", config);
    $("password").value = "";
    say("");
    show(true);
  } catch (error) {
    say("Não entrou: " + (/invalid login/i.test(error.message) ? "e-mail ou senha incorretos" : error.message) + ".");
  }
};

$("logout").onclick = () => { session = null; store.del("session"); show(false); };
$("refresh").onclick = load;
$("filter").onchange = load;
$("onlyProblems").onchange = load;
$("purge").onclick = async () => {
  if (!confirm("Apagar do banco todos os registros recebidos há mais de 30 dias?")) return;
  try {
    const limit = new Date(Date.now() - 30 * 24 * 3600 * 1000).toISOString();
    await api("camtv_registros?recebido_em=lt." + encodeURIComponent(limit), { method: "DELETE" });
    say("Registros antigos apagados.");
    load();
  } catch (error) {
    say("Não foi possível apagar: " + error.message + ".");
  }
};

show(!!(session && session.access && config.project && config.key));
</script>
</body>
</html>
